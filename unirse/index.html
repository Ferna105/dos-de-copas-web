<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sin scripts ni recursos de terceros: el secreto de la invitación (después del #) nunca sale de este navegador. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Unite a Dos de copas</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <h1>Te invitaron a un muro</h1>
    <p id="intro">Tu pareja te invitó a compartir un muro privado en Dos de copas.</p>
    <a id="open" class="button" href="#">Abrir en Dos de copas</a>
    <p class="muted" id="hint">La invitación vence a los 15 minutos y sirve una sola vez. Necesitás la app instalada en Android.</p>
  </main>
  <script src="unirse.js"></script>
</body>
</html>
